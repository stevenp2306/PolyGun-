[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polybot"
version = "0.1.0"
description = "Conservative, evidence-first Polymarket monitoring and trading bot (PAPER mode by default)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - personal use" }
dependencies = [
  # Official unified Polymarket SDK (replaces the archived py-clob-client and the
  # deprecated py-clob-client-v2). Pinned because 0.x minor releases may break.
  "polymarket-client==0.14.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
polybot = "polybot.cli:main"

[tool.setuptools.packages.find]
include = ["polybot*"]

[tool.setuptools.package-data]
polybot = ["dashboard/static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
